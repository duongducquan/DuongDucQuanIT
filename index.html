            }

                position: fixed;

            }

            .glow-orb {
                position: absolute;
                border-radius: 50%;
                filter: blur(90px);
                opacity: .35;
                will-change: transform;
                animation: orbFloat 26s var(--ease-in-out) infinite alternate
            }

            .orb-a {
                width: 420px;
                height: 420px;
                top: -120px;
                left: -120px;
                background: var(--violet)
            }

            .orb-b {
                width: 380px;
                height: 380px;
                top: 200px;
                right: -140px;
                background: var(--blue);
                animation-name: orbFloat2;
                animation-duration: 30s
            }

            .orb-c {
                width: 300px;
                height: 300px;
                top: 55%;
                left: 35%;
                background: var(--av-cyan);
                opacity: .14;
                animation-duration: 36s
            }

            @keyframes orbFloat {
                0% {
                    transform: translate3d(0,0,0) scale(1)
                }

                50% {
                    transform: translate3d(70px,50px,0) scale(1.08)
                }

                100% {
                    transform: translate3d(-30px,90px,0) scale(.95)

            }

            @keyframes orbFloat2 {
                0% {
                    transform: translate3d(0,0,0) scale(1)
                }

                50% {

            .avatar {
                --size: 300px;
                --ring: 5px;
                position: relative;
                width: var(--size);
                height: calc(var(--size) * 20 / 9);
                border-radius: 34px;
                isolation: isolate
            }

            .avatar-glow {
                position: absolute;
                inset: -12%;
                border-radius: 34px;
                z-index: -2;
                background: conic-gradient(from 0deg,var(--av-cyan),var(--av-blue),var(--av-violet),var(--av-pink),var(--av-cyan));
                filter: blur(36px);
                opacity: .45;
                will-change: transform,opacity;
                animation: breathe 5s ease-in-out infinite
            }

            @keyframes breathe {
                0%,100% {
                    transform: scale(.94);
                    opacity: .36
                }

                50% {
                    transform: scale(1.04);
                    opacity: .6
                }
            }

            .avatar-ring {
                position: absolute;
                inset: 0;
                border-radius: 34px;
                will-change: transform;
                animation: spin 8s linear infinite
            }

            .avatar-ring::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 34px;
                background: conic-gradient(from 0deg,var(--av-cyan),var(--av-blue),var(--av-violet),var(--av-pink),var(--av-cyan));
                animation: spin 2.4s linear infinite paused
            }

            .avatar:hover .avatar-ring::before {
                animation-play-state: running
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }

            .avatar-photo {
                position: absolute;
                inset: var(--ring);
                z-index: 1;
                border-radius: 30px;
                padding: 4px;

            .avatar-photo picture {
                display: block;
                width: 100%;

            .avatar-photo img {
                display: block;
                width: 100%;
                height: 100%;

                object-fit: cover;
                object-position: center;
                transition: transform .7s var(--ease)
            }

            .avatar:hover .avatar-photo img {

            .avatar-orbit {
                position: absolute;
                border-radius: 50%;
                pointer-events: none;
                z-index: -1;
                border: 1px solid rgba(94,231,216,.2);

            }

            .orbit-1 {

            .orbit-2 {
                inset: calc(var(--size) * -.145);
                border-style: dashed;
                border-color: rgba(124,92,255,.25);
                animation-duration: 32s;

            }

            .orbit-dot {

            .orbit-2 .orbit-dot {

            .js .reveal {
                --reveal-tr: opacity var(--dur-reveal) var(--ease) var(--d,0ms),translate var(--dur-reveal) var(--ease) var(--d,0ms),scale var(--dur-reveal) var(--ease) var(--d,0ms),filter var(--dur-reveal) var(--ease) var(--d,0ms);
                opacity: 0;
                transition: var(--reveal-tr)
            }

            .js .reveal[data-anim="fade-up"] {
                translate: 0 28px
            }

            .js .reveal[data-anim="fade-left"] {
                translate: 40px 0
            }

            .js .reveal[data-anim="fade-right"] {
                translate: -40px 0
            }

            .js .reveal[data-anim="zoom-in"] {

                opacity: 1;

                scale: none;

            }

            /* === CINEMATIC PRELOADER — DƯƠNG ĐỨC QUÂN IT === */
            .npd-preloader {
                --pl-bg-1: #050816;
                --pl-bg-2: #0B1120;
                --pl-primary: #2563EB;
                --pl-secondary: #06B6D4;
                --pl-accent: #38BDF8;
                --pl-text: #FFFFFF;
                --pl-muted: #94A3B8;
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                z-index: 99999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(circle at 50% 42%,rgba(37,99,235,.16) 0%,rgba(6,182,212,.06) 36%,transparent 72%),linear-gradient(160deg,var(--pl-bg-1) 0%,var(--pl-bg-2) 100%);
                color: var(--pl-text);
                font-family: var(--font-sans);
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                isolation: isolate;
                will-change: transform,opacity;
                transition: transform .9s cubic-bezier(.76,0,.24,1),opacity .65s cubic-bezier(.22,1,.36,1),visibility 0s linear .95s
            }

            html:not(.js) .npd-preloader,html.reveal-fallback .npd-preloader {
                display: none !important
            }

            html.is-preloading,html.is-preloading body {
                overflow: hidden !important
            }

            .npd-preloader.is-complete .npd-pl-logo-box {
                transform: scale(1.06);
                filter: drop-shadow(0 0 38px rgba(56,189,248,.92))
            }

            .npd-preloader.is-complete .npd-pl-progress-fill {
                box-shadow: 0 0 26px rgba(56,189,248,.95),0 0 48px rgba(6,182,212,.6)
            }

            .npd-preloader.is-exiting {
                transform: translate3d(0,-102%,0);
                opacity: 0;
                visibility: hidden;
                pointer-events: none
            }

            .npd-preloader::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 2px;
                background: linear-gradient(90deg,transparent,var(--pl-primary),var(--pl-secondary),var(--pl-accent),transparent);
                box-shadow: 0 0 24px var(--pl-accent);
                opacity: .85
            }

            .npd-pl-grid {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                background-image: linear-gradient(rgba(56,189,248,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.055) 1px,transparent 1px);
                background-size: 48px 48px;
                -webkit-mask-image: radial-gradient(circle at 50% 48%,#000 18%,transparent 74%);
                mask-image: radial-gradient(circle at 50% 48%,#000 18%,transparent 74%)
            }

            .npd-pl-glow {
                position: absolute;
                width: min(540px,88vw);
                height: min(540px,88vw);
                border-radius: 50%;
                background: radial-gradient(circle,rgba(37,99,235,.22) 0%,rgba(6,182,212,.11) 42%,transparent 70%);
                filter: blur(48px);
                pointer-events: none;
                z-index: 0;
                animation: npdGlowPulse 4.2s ease-in-out infinite alternate
            }

            @keyframes npdGlowPulse {
                0% {
                    transform: scale(.92);
                    opacity: .65
                }

                100% {
                    transform: scale(1.08);
                    opacity: 1
                }
            }

            .npd-pl-particles {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 1;
                overflow: hidden;
                contain: strict
            }

            .npd-pl-particle {
                position: absolute;
                left: var(--x,50%);
                top: var(--y,50%);
                width: var(--s,3px);
                height: var(--s,3px);
                border-radius: 50%;
                background: var(--c,#38BDF8);
                box-shadow: 0 0 10px var(--c,#38BDF8);
                opacity: 0;
                will-change: transform,opacity;
                animation: npdParticleFloat var(--d,7s) ease-in-out var(--dl,0s) infinite
            }

            @keyframes npdParticleFloat {
                0% {
                    transform: translate3d(0,18px,0) scale(.6);
                    opacity: 0
                }

                30% {
                    opacity: var(--o,.65)
                }

                70% {
                    opacity: var(--o,.65)
                }

                100% {
                    transform: translate3d(var(--tx,14px),var(--ty,-64px),0) scale(1.1);
                    opacity: 0
                }
            }

            .npd-pl-content {
                position: relative;
                z-index: 2;
                width: min(500px,90vw);
                padding: 34px 26px 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                background: rgba(11,17,32,.46);
                border: 1px solid rgba(56,189,248,.16);
                border-radius: 26px;
                box-shadow: 0 26px 64px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.08);
                -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px)
            }

            .npd-pl-content::before {
                content: "";
                position: absolute;
                top: -1px;
                left: 18%;
                right: 18%;
                height: 1px;
                background: linear-gradient(90deg,transparent,rgba(56,189,248,.75),transparent)

            @keyframes npdLogoReveal {

                    opacity: 1;
                    transform: scale(1);
                    filter: blur(0)
                }
            }

            .npd-pl-ring-svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                overflow: visible;
                pointer-events: none
            }

            .npd-pl-ring-outer {
                transform-origin: 50% 50%;
                animation: npdSpin 9s linear infinite
            }

            .npd-pl-ring-inner {
                transform-origin: 50% 50%;
                animation: npdSpinRev 14s linear infinite
            }

            @keyframes npdSpin {
                to {
                    transform: rotate(360deg)
                }
            }

            @keyframes npdSpinRev {
                to {
                    transform: rotate(-360deg)
                }
            }

            .npd-pl-logo-box {
                position: relative;
                width: 96px;
                height: 96px;
                border-radius: 50%;
                padding: 3px;
                background: linear-gradient(135deg,var(--pl-primary),var(--pl-secondary),var(--pl-accent));
                box-shadow: 0 0 28px -4px rgba(6,182,212,.55),0 10px 26px -8px rgba(0,0,0,.85);
                overflow: hidden;
                transition: transform .5s var(--ease),filter .5s var(--ease);
                animation: npdLogoPulse 3s ease-in-out infinite
            }

            @keyframes npdLogoPulse {
                0%,100% {
                    box-shadow: 0 0 24px -4px rgba(6,182,212,.5),0 0 0 0 rgba(56,189,248,0)
                }

                50% {
                    box-shadow: 0 0 36px 2px rgba(56,189,248,.75),0 0 0 6px rgba(56,189,248,.09)
                }
            }

            .npd-pl-logo-inner {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                overflow: hidden;
                background: var(--pl-bg-1);
                display: flex;
                align-items: center;
                justify-content: center
            }

            .npd-pl-logo-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 18%;
                display: block;
                border-radius: 50%
            }

            .npd-pl-monogram {
                display: none;
                font-weight: 800;
                font-size: 26px;
                letter-spacing: 1.5px;
                background: linear-gradient(135deg,#FFFFFF 0%,var(--pl-accent) 55%,var(--pl-secondary) 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent
            }

            .npd-pl-logo-box.is-fallback .npd-pl-logo-img {
                display: none
            }

            .npd-pl-logo-box.is-fallback .npd-pl-monogram {
                display: block
            }

            .npd-pl-logo-inner::after {
                content: "";
                position: absolute;
                top: -20%;
                left: -130%;
                width: 75%;
                height: 140%;
                background: linear-gradient(90deg,transparent,rgba(255,255,255,.5),rgba(56,189,248,.35),transparent);
                transform: skewX(-25deg);
                pointer-events: none;
                animation: npdLightSweep 2.7s cubic-bezier(.4,0,.2,1) .55s infinite
            }

            @keyframes npdLightSweep {
                0% {
                    left: -130%
                }

                48%,100% {
                    left: 165%
                }
            }

            .npd-pl-brand {
                margin: 0 0 8px;
                font-size: clamp(21px,4.5vw,27px);
                font-weight: 700;
                letter-spacing: .14em;
                text-transform: uppercase;
                color: var(--pl-text);
                line-height: 1.25;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: .28em
            }

            .npd-pl-word {
                display: inline-flex
            }

            .npd-pl-char {
                display: inline-block;
                opacity: 0;
                transform: translate3d(0,16px,0);
                animation: npdCharReveal .55s cubic-bezier(.22,1,.36,1) calc(var(--ci,0) * 32ms + 180ms) forwards
            }

            .npd-pl-char.is-accent {
                background: linear-gradient(135deg,#FFFFFF 15%,var(--pl-accent) 60%,var(--pl-secondary) 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent
            }

            @keyframes npdCharReveal {
                to {
                    opacity: 1;
                    transform: translate3d(0,0,0)
                }
            }

            .npd-pl-subtitle {
                margin: 0 0 26px;
                font-family: var(--font-mono);
                font-size: clamp(10px,2.3vw,11.5px);
                font-weight: 600;
                letter-spacing: .2em;
                text-transform: uppercase;
                color: var(--pl-muted);
                opacity: 0;
                transform: translate3d(0,10px,0);
                animation: npdCharReveal .65s cubic-bezier(.22,1,.36,1) .55s forwards
            }

            .npd-pl-subtitle .sep {
                color: var(--pl-secondary);
                margin: 0 6px;
                font-weight: 700
            }

            .npd-pl-progress-wrap {
                width: 100%;
                max-width: 370px;
                opacity: 0;
                transform: translate3d(0,12px,0);
                animation: npdCharReveal .65s cubic-bezier(.22,1,.36,1) .68s forwards
            }

            .npd-pl-meta-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 9px;
                font-family: var(--font-mono);
                font-size: 11px;
                letter-spacing: .13em;
                text-transform: uppercase
            }

            .npd-pl-init {
                color: var(--pl-accent);
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 7px
            }

            .npd-pl-init-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--pl-secondary);
                box-shadow: 0 0 8px var(--pl-secondary);
                animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite
            }

            .npd-pl-pct-box {
                color: var(--pl-text);
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                letter-spacing: .08em
            }

            .npd-pl-pct-box .br {
                color: var(--pl-secondary);
                font-weight: 500
            }

            .npd-pl-pct-val {
                color: var(--pl-accent);
                text-shadow: 0 0 12px rgba(56,189,248,.6)
            }

            .npd-pl-bar {
                position: relative;
                width: 100%;
                height: 6px;
                border-radius: 999px;
                background: rgba(148,163,184,.15);
                border: 1px solid rgba(56,189,248,.16);
                overflow: hidden;
                box-shadow: inset 0 1px 2px rgba(0,0,0,.6)
            }

            .npd-pl-progress-fill {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 999px;
                background: linear-gradient(90deg,var(--pl-primary) 0%,var(--pl-secondary) 55%,var(--pl-accent) 100%);
                box-shadow: 0 0 16px rgba(6,182,212,.75);
                transform: scaleX(0);
                transform-origin: left center;
                will-change: transform;
                transition: box-shadow .3s ease
            }

            .npd-pl-progress-fill::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,.78) 50%,transparent 100%);
                transform: translateX(-100%);
                animation: npdBarShimmer 1.35s linear infinite
            }

            @keyframes npdBarShimmer {
                to {
                    transform: translateX(100%)
                }
            }

            .npd-pl-status-row {
                margin-top: 14px;
                min-height: 20px;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .npd-pl-status {
                font-family: var(--font-mono);
                font-size: 11.5px;
                font-weight: 500;
                letter-spacing: .14em;
                text-transform: uppercase;
                color: var(--pl-muted);
                transition: opacity .2s ease,transform .2s ease,color .25s ease
            }

            .npd-pl-status.is-switching {
                opacity: 0;
                transform: translateY(4px)
            }

            .npd-pl-status.is-welcome {
                color: var(--pl-accent);
                font-weight: 700;
                letter-spacing: .26em;
                text-shadow: 0 0 16px rgba(56,189,248,.8)
            }

            html.is-preloading .site-header,html.is-preloading #main {
                opacity: 0;
                transform: translate3d(0,16px,0)
            }

            .site-header,#main {
                transition: opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)
            }

            html.preloader-done .hero .badge-hello {
                animation: npdHeroItemIn .65s var(--ease) .05s both
            }

            html.preloader-done .hero .hero-title {
                animation: npdHeroItemIn .7s var(--ease) .14s both
            }

            html.preloader-done .hero .hero-role {
                animation: npdHeroItemIn .7s var(--ease) .23s both
            }

            html.preloader-done .hero .hero-desc {
                animation: npdHeroItemIn .7s var(--ease) .32s both
            }

            html.preloader-done .hero .hero-cta {
                animation: npdHeroItemIn .7s var(--ease) .41s both
            }

            html.preloader-done .hero .avatar-wrap {
                animation: npdHeroItemIn .8s var(--ease) .2s both
            }

            @keyframes npdHeroItemIn {
                from {
                    opacity: 0;
                    transform: translate3d(0,22px,0)
                }

                to {
                    opacity: 1;
                    transform: translate3d(0,0,0)
                }
            }

            @media (max-width: 767.98px) {
                .npd-pl-content {
                    padding:28px 20px 24px;
                    border-radius: 22px
                }

                .npd-pl-logo-wrap {
                    width: 118px;
                    height: 118px;
                    margin-bottom: 20px
                }

                .npd-pl-logo-box {
                    width: 84px;
                    height: 84px
                }

                .npd-pl-particle:nth-child(n+11) {
                    display: none
                }

                .npd-pl-glow {
                    filter: blur(34px)
                }
            }

            @media (max-width: 479.98px) {
                .npd-pl-brand {
                    letter-spacing:.1em
                }

                .npd-pl-subtitle {
                    letter-spacing: .12em;
                    font-size: 9.8px;
                    margin-bottom: 22px
                }

                .npd-pl-meta-top {
                    font-size: 10px
                }
            }

            @media (prefers-reduced-motion:reduce) {
                .npd-preloader {
                    transition: opacity .25s ease !important;
                    transform: none !important
                }

                .npd-pl-logo-wrap,.npd-pl-char,.npd-pl-subtitle,.npd-pl-progress-wrap {
                    opacity: 1 !important;
                    transform: none !important;
                    filter: none !important;
                    animation: none !important
                }

                .npd-pl-particles,.npd-pl-logo-inner::after,.npd-pl-progress-fill::after {
                    display: none !important
                }
            }

        <script>
(function () {
    'use strict';
    var d = document;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Scroll progress, header state, back-to-top
    var prog = d.getElementById('scrollProgress');
    var header = d.getElementById('siteHeader');
    var btt = d.getElementById('backToTop');

    function onScroll() {
        var y = window.scrollY || window.pageYOffset || 0;
        var max = d.documentElement.scrollHeight - window.innerHeight;
        if (prog) prog.style.transform = 'scaleX(' + (max > 0 ? y / max : 0) + ')';
        if (header) header.classList.toggle('is-scrolled', y > 10);
        if (btt) btt.classList.toggle('is-visible', y > 600);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    onScroll();
    if (btt) btt.addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });

    // Mobile nav toggle
    var toggle = d.querySelector('.nav-toggle');
    var navLinks = d.getElementById('navLinks');
    if (toggle && navLinks) {
        toggle.addEventListener('click', function () {
            var open = navLinks.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu');
        });
        navLinks.addEventListener('click', function (e) {
            if (e.target.closest('a')) {
                navLinks.classList.remove('is-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    }

    // Active nav link while scrolling
    var navAnchors = [].slice.call(d.querySelectorAll('.nav-links a[href^="#"]'));
    var sections = navAnchors
        .map(function (a) { return d.querySelector(a.getAttribute('href')); })
        .filter(Boolean);
    function setActive(id) {
        navAnchors.forEach(function (a) {
            var on = a.getAttribute('href') === '#' + id;
            a.classList.toggle('active', on);
            if (on) a.setAttribute('aria-current', 'true');
            else a.removeAttribute('aria-current');
        });
    }
    if ('IntersectionObserver' in window && sections.length) {
        var navIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) setActive(en.target.id);
            });
        }, { rootMargin: '-40% 0px -55% 0px' });
        sections.forEach(function (s) { navIo.observe(s); });
    }

    // Reveal on scroll
    var reveals = [].slice.call(d.querySelectorAll('.reveal'));
    reveals.forEach(function (el) {
        var delay = parseInt(el.getAttribute('data-delay') || '0', 10);
        if (delay) el.style.setProperty('--d', delay + 'ms');
    });
    if ('IntersectionObserver' in window && !reduceMotion) {
        var revIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    en.target.classList.add('is-visible');
                    revIo.unobserve(en.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        reveals.forEach(function (el) { revIo.observe(el); });
    } else {
        reveals.forEach(function (el) { el.classList.add('is-visible'); });
    }

    // Counters
    function animateCounter(el) {
        var target = parseFloat(el.getAttribute('data-target') || '0');
        if (reduceMotion) { el.textContent = target; return; }
        var start = null, dur = 1600;
        function step(ts) {
            if (start === null) start = ts;
            var p = Math.min((ts - start) / dur, 1);
            p = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * p);
            if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }
    var stats = d.getElementById('stats');
    var counters = [].slice.call(d.querySelectorAll('.counter'));
    if (stats && 'IntersectionObserver' in window && !reduceMotion) {
        var done = false;
        var cIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting && !done) {
                    done = true;
                    counters.forEach(animateCounter);
                    cIo.disconnect();
                }
            });
        }, { threshold: 0.4 });
        cIo.observe(stats);
    } else {
        counters.forEach(animateCounter);
    }

    // Skill bars
    var skillRows = [].slice.call(d.querySelectorAll('.skill-row'));
    if ('IntersectionObserver' in window && !reduceMotion) {
        var sIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    en.target.classList.add('is-animated');
                    sIo.unobserve(en.target);
                }
            });
        }, { threshold: 0.4 });
        skillRows.forEach(function (row) { sIo.observe(row); });
    } else {
        skillRows.forEach(function (row) { row.classList.add('is-animated'); });
    }

    // Typed role
    var typed = d.getElementById('typedRole');
    if (typed && !reduceMotion) {
        var roles = ['Fullstack Developer', 'PHP Developer', 'Node.js Developer', 'React Developer'];
        var ri = 0, ci = roles[0].length, deleting = true;
        function typeTick() {
            var word = roles[ri];
            typed.textContent = word.slice(0, ci);
            var next;
            if (!deleting) {
                if (ci === word.length) { deleting = true; next = 1700; }
                else { ci++; next = 95; }
            } else {
                if (ci === 0) { deleting = false; ri = (ri + 1) % roles.length; next = 350; }
                else { ci--; next = 45; }
            }
            setTimeout(typeTick, next);
        }
        setTimeout(typeTick, 1400);
    }

    // Lightbox
    var lb = d.getElementById('lightbox');
    var lbImg = d.getElementById('lightboxImg');
    var lbCap = d.getElementById('lightboxCap');
    var lbClose = d.getElementById('lightboxClose');
    function openLb(src, alt, cap) {
        if (!lb) return;
        lbImg.src = src;
        lbImg.alt = alt || '';
        lbCap.textContent = cap || '';
        lb.hidden = false;
        requestAnimationFrame(function () { lb.classList.add('is-open'); });
        d.body.style.overflow = 'hidden';
    }
    function closeLb() {
        if (!lb || lb.hidden) return;
        lb.classList.remove('is-open');
        d.body.style.overflow = '';
        setTimeout(function () { lb.hidden = true; lbImg.src = ''; }, 250);
    }
    [].forEach.call(d.querySelectorAll('.moment-media'), function (a) {
        a.addEventListener('click', function (e) {
            e.preventDefault();
            openLb(
                a.getAttribute('data-lightbox') || a.getAttribute('href'),
                a.getAttribute('data-alt'),
                a.getAttribute('data-caption')
            );
        });
    });
    if (lbClose) lbClose.addEventListener('click', closeLb);
    if (lb) lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target === lb.querySelector('.lightbox-inner')) closeLb();
    });
    d.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLb();
    });

    // Contact form (FormSubmit AJAX)
    var form = d.getElementById('contactForm');
    if (form) {
        var status = d.getElementById('formStatus');
        var btn = form.querySelector('.btn-submit');
        function setStatus(msg, cls) {
            if (!status) return;
            status.textContent = msg;
            status.classList.remove('is-success', 'is-error');
            if (cls) status.classList.add(cls);
        }
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var valid = true;
            [].forEach.call(form.querySelectorAll('[required]'), function (f) {
                var ok = f.checkValidity();
                var field = f.closest('.field');
                if (field) field.classList.toggle('is-invalid', !ok);
                if (!ok) valid = false;
            });
            if (!valid) { setStatus('Vui lòng điền đầy đủ thông tin hợp lệ.', 'is-error'); return; }
            if (btn) btn.classList.add('is-loading');
            setStatus('');
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(function (res) {
                if (btn) btn.classList.remove('is-loading');
                if (res.ok) {
                    if (btn) btn.classList.add('is-success');
                    form.reset();
                    setStatus('Cảm ơn bạn! Tin nhắn đã được gửi thành công.', 'is-success');
                    setTimeout(function () { if (btn) btn.classList.remove('is-success'); }, 4000);
                } else {
                    setStatus('Không gửi được tin nhắn. Vui lòng thử lại sau.', 'is-error');
                }
            }).catch(function () {
                if (btn) btn.classList.remove('is-loading');
                setStatus('Lỗi kết nối. Vui lòng thử lại sau.', 'is-error');
            });
        });
    }

    // Footer year
    var year = d.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();

    window.__appReady = true;
}());
        </script>
    </body>
</html>
