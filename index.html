    window.addEventListener('scroll', queueScroll, { passive: true });
    window.addEventListener('load', function () { setTimeout(measureScroll, 600); });
    window.addEventListener('resize', function () { measureScroll(); queueScroll(); }, { passive: true });
    measureScroll();
    onScroll();
    if (btt) btt.addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });

    // Mobile nav toggle
    var toggle = d.querySelector('.nav-toggle');
    var navLinks = d.getElementById('navLinks');
    if (toggle && navLinks) {
        toggle.addEventListener('click', function () {
            var open = navLinks.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu');
        });
        navLinks.addEventListener('click', function (e) {
            if (e.target.closest('a')) {
                navLinks.classList.remove('is-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    }

    // Active nav link while scrolling
    var navAnchors = [].slice.call(d.querySelectorAll('.nav-links a[href^="#"]'));
    var sections = navAnchors
        .map(function (a) { return d.querySelector(a.getAttribute('href')); })
        .filter(Boolean);
    function setActive(id) {
        navAnchors.forEach(function (a) {
            var on = a.getAttribute('href') === '#' + id;
            a.classList.toggle('active', on);
            if (on) a.setAttribute('aria-current', 'true');
            else a.removeAttribute('aria-current');
        });
    }
    if ('IntersectionObserver' in window && sections.length) {
        var navIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) setActive(en.target.id);
            });
        }, { rootMargin: '-40% 0px -55% 0px' });
        sections.forEach(function (s) { navIo.observe(s); });
    }

    // Reveal on scroll
    var reveals = [].slice.call(d.querySelectorAll('.reveal'));
    reveals.forEach(function (el) {
        var delay = parseInt(el.getAttribute('data-delay') || '0', 10);
        if (delay) el.style.setProperty('--d', delay + 'ms');
    });
    // Footer stylesheet: fetch only when the footer approaches the viewport
    var ftIo = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries, io) {
        if (entries.some(function (en) { return en.isIntersecting; })) {
            io.disconnect();
            var l = d.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'footer.css';
            d.head.appendChild(l);
        }
    }, { rootMargin: '800px 0px' }) : null;
    var footerEl = d.querySelector('.npd-footer');
    if (footerEl) {
        if (ftIo) ftIo.observe(footerEl);
        else {
            var fl = d.createElement('link');
            fl.rel = 'stylesheet';
            fl.href = 'footer.css';
            d.head.appendChild(fl);
        }
    }

    if ('IntersectionObserver' in window && !reduceMotion) {
        var revIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    en.target.classList.add('is-visible');
                    revIo.unobserve(en.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        reveals.forEach(function (el) { revIo.observe(el); });
    } else {
        reveals.forEach(function (el) { el.classList.add('is-visible'); });
    }

    // Counters
    function animateCounter(el) {
        var target = parseFloat(el.getAttribute('data-target') || '0');
        if (reduceMotion) { el.textContent = target; return; }
        var start = null, dur = 1600;
        function step(ts) {
            if (start === null) start = ts;
            var p = Math.min((ts - start) / dur, 1);
            p = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * p);
            if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }
    var stats = d.getElementById('stats');
    var counters = [].slice.call(d.querySelectorAll('.counter'));
    if (stats && 'IntersectionObserver' in window && !reduceMotion) {
        var done = false;
        var cIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting && !done) {
                    done = true;
                    counters.forEach(animateCounter);
                    cIo.disconnect();
                }
            });
        }, { threshold: 0.4 });
        cIo.observe(stats);
    } else {
        counters.forEach(animateCounter);
    }

    // Skill bars
    var skillRows = [].slice.call(d.querySelectorAll('.skill-row'));
    if ('IntersectionObserver' in window && !reduceMotion) {
        var sIo = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    en.target.classList.add('is-animated');
                    sIo.unobserve(en.target);
                }
            });
        }, { threshold: 0.4 });
        skillRows.forEach(function (row) { sIo.observe(row); });
    } else {
        skillRows.forEach(function (row) { row.classList.add('is-animated'); });
    }

    // Typed role
    var typed = d.getElementById('typedRole');
    if (typed && !reduceMotion) {
        var roles = ['Fullstack Developer', 'PHP Developer', 'Node.js Developer', 'React Developer'];
        var ri = 0, ci = roles[0].length, deleting = true;
        function typeTick() {
            var word = roles[ri];
            typed.textContent = word.slice(0, ci);
            var next;
            if (!deleting) {
                if (ci === word.length) { deleting = true; next = 1700; }
                else { ci++; next = 95; }
            } else {
                if (ci === 0) { deleting = false; ri = (ri + 1) % roles.length; next = 350; }
                else { ci--; next = 45; }
            }
            setTimeout(typeTick, next);
        }
        setTimeout(typeTick, 1400);
    }

    // Lightbox
    var lb = d.getElementById('lightbox');
    var lbImg = d.getElementById('lightboxImg');
    var lbCap = d.getElementById('lightboxCap');
    var lbClose = d.getElementById('lightboxClose');
    function openLb(src, alt, cap) {
        if (!lb) return;
        lbImg.src = src;
        lbImg.alt = alt || '';
        lbCap.textContent = cap || '';
        lb.hidden = false;
        requestAnimationFrame(function () { lb.classList.add('is-open'); });
        d.body.style.overflow = 'hidden';
    }
    function closeLb() {
        if (!lb || lb.hidden) return;
        lb.classList.remove('is-open');
        d.body.style.overflow = '';
        setTimeout(function () { lb.hidden = true; lbImg.src = ''; }, 250);
    }
    [].forEach.call(d.querySelectorAll('.moment-media'), function (a) {
        a.addEventListener('click', function (e) {
            e.preventDefault();
            openLb(
                a.getAttribute('data-lightbox') || a.getAttribute('href'),
                a.getAttribute('data-alt'),
                a.getAttribute('data-caption')
            );
        });
    });
    if (lbClose) lbClose.addEventListener('click', closeLb);
    if (lb) lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target === lb.querySelector('.lightbox-inner')) closeLb();
    });
    d.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLb();
    });

    // Contact form (FormSubmit AJAX)
    var form = d.getElementById('contactForm');
    if (form) {
        var status = d.getElementById('formStatus');
        var btn = form.querySelector('.btn-submit');
        function setStatus(msg, cls) {
            if (!status) return;
            status.textContent = msg;
            status.classList.remove('is-success', 'is-error');
            if (cls) status.classList.add(cls);
        }
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var valid = true;
            [].forEach.call(form.querySelectorAll('[required]'), function (f) {
                var ok = f.checkValidity();
                var field = f.closest('.field');
                if (field) field.classList.toggle('is-invalid', !ok);
                if (!ok) valid = false;
            });
            if (!valid) { setStatus('Vui lòng điền đầy đủ thông tin hợp lệ.', 'is-error'); return; }
            if (btn) btn.classList.add('is-loading');
            setStatus('');
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(function (res) {
                if (btn) btn.classList.remove('is-loading');
                if (res.ok) {
                    if (btn) btn.classList.add('is-success');
                    form.reset();
                    setStatus('Cảm ơn bạn! Tin nhắn đã được gửi thành công.', 'is-success');
                    setTimeout(function () { if (btn) btn.classList.remove('is-success'); }, 4000);
                } else {
                    setStatus('Không gửi được tin nhắn. Vui lòng thử lại sau.', 'is-error');
                }
            }).catch(function () {
                if (btn) btn.classList.remove('is-loading');
                setStatus('Lỗi kết nối. Vui lòng thử lại sau.', 'is-error');
            });
        });
    }

    // Footer year
    var year = d.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();

    window.__appReady = true;
}());
        </script>
    </body>
</html>
